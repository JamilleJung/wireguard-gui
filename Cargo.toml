[package]
name = "wireguard-gui"
version = "1.9.3"
edition = "2024"
rust-version = "1.92"
description = "A native Linux GUI for managing plain WireGuard tunnels with wg and wg-quick."
license = "MIT"
repository = "https://github.com/JamilleJung/wireguard-gui"
readme = "README.md"
default-run = "wireguard-gui"

[[bin]]
name = "wireguard-gui"
path = "src/main.rs"

[[bin]]
name = "wg-helper"
path = "src/bin/wg-helper/main.rs"

[dependencies]
slint = "1"
rfd = "0.17"
libc = "0.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Text-only clipboard (the app only ever calls set_text), so arboard's
# image-data path is not compiled.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[dev-dependencies]
# Headless Slint backend for the window layout / accessibility / keyboard tests
# (src/ui_tests.rs). Pinned to the slint version in Cargo.lock.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1"

[profile.test]
# The compiled Slint UI is large; full debug info for it needs several GiB of
# memory to compile. Line tables keep test backtraces useful.
debug = "line-tables-only"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# `cargo deb` packaging — installs to /usr and uses the polkit rule for auth.
[package.metadata.deb]
maintainer = "jamillejung <izeystudio@gmail.com>"
copyright = "2026 wireguard-gui contributors"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = "A native Linux GUI for managing plain WireGuard tunnels through wg and wg-quick: tunnel list, live status, activate/deactivate, import, QR, editing with validation, and a small privileged helper."
depends = "$auto, wireguard-tools, iproute2, libfontconfig1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libegl1, libgl1, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrender1, libxcb1, libdbus-1-3, pkexec | polkit-1 | policykit-1, nftables | iptables"
recommends = "xdg-desktop-portal, openresolv | systemd-resolved, minisign"
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/wireguard-gui", "usr/bin/", "755"],
    ["target/release/wg-helper", "usr/lib/wireguard-gui/wg-helper", "755"],
    ["packaging/wireguard-gui.desktop", "usr/share/applications/", "644"],
    ["packaging/wireguard-gui.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/49-wireguard-gui.rules", "etc/polkit-1/rules.d/", "644"],
    ["README.md", "usr/share/doc/wireguard-gui/README.md", "644"],
]
