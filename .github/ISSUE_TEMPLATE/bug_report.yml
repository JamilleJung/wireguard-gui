name: 🐛 Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem below. Accessibility reports are welcome too.
        Do not post private keys, preshared keys, full tunnel configs, QR codes
        or backup archives. Redact sensitive addresses and account details.
        Report security vulnerabilities privately using
        [SECURITY.md](https://github.com/JamilleJung/wireguard-gui/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs actual…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `wireguard-gui --version`, plus `git rev-parse --short HEAD` if built from source.
      placeholder: "wireguard-gui 1.9.3"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro & package manager
      placeholder: "Distribution and version, package manager, and CPU architecture (uname -m)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh (sudoers)
        - install.sh --polkit
        - .deb
        - AppImage
        - prebuilt release tarball
        - native distro recipe (AUR/RPM/Alpine/Void)
        - built from source
    validations:
      required: true
  - type: input
    id: session
    attributes:
      label: Desktop / session
      description: Include display scaling and, if relevant, the assistive tool or input method involved. Personal or medical information is not needed.
      placeholder: "GNOME on Wayland, KDE on X11, …  (echo $XDG_SESSION_TYPE)"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant output. Helpful commands:
        `journalctl -t wireguard-gui --no-pager | tail -n 50`
        and run the app from a terminal to capture its stderr.
        Remove PrivateKey/PresharedKey values and sensitive addresses before posting.
        Do not attach a full tunnel config, QR code, or backup archive.
      render: shell
