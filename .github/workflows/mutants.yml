name: Mutation testing

# cargo-mutants over validation and security-critical logic: config
# validation, tunnel-name rules, secret redaction and the privileged helper.
# A "missed" mutant is a change to that code that no test notices. Missed
# mutants are reported (job summary + artifact) rather than failing the run;
# a broken baseline (tests failing without any mutation) does fail it.
on:
  schedule:
    - cron: "31 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants
      - name: Run cargo mutants (shard ${{ matrix.shard }} of 4)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          cargo mutants --shard "$SHARD/4" --sharding round-robin \
            --timeout 300 --build-timeout 900 --cargo-arg=--locked \
            --file src/validation.rs --file src/config.rs --file src/secrets.rs \
            --file 'src/bin/wg-helper/**/*.rs'
          rc=$?
          set -e
          echo "cargo mutants exit status: $rc"
          # 0 = all caught, 2 = some missed, 3 = some timed out: report, do not
          # fail. Anything else (1 usage, 4 baseline tests failed) is an error.
          case "$rc" in 0|2|3) ;; *) exit "$rc" ;; esac
      - name: Summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "## Mutation testing, shard $SHARD/4"
            for kind in caught missed timeout unviable; do
              f="mutants.out/$kind.txt"
              [ -f "$f" ] && echo "- $kind: $(wc -l < "$f")"
            done
            if [ -s mutants.out/missed.txt ]; then
              echo
              echo "### Missed mutants (no test failed)"
              echo '```text'
              head -n 200 mutants.out/missed.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: warn
          retention-days: 30
