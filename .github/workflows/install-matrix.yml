name: Install matrix

# Installs, upgrades, rolls back and uninstalls with install.sh in real distro
# containers, and lints the distro recipes with each distribution's tools.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing here publishes or writes to the repository.
permissions:
  contents: read

concurrency:
  group: install-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries-glibc:
    name: Build glibc test binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: install-matrix-glibc
      - name: Build
        run: |
          cargo build --release --locked
          mkdir -p bins
          cp target/release/wireguard-gui target/release/wg-helper bins/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-matrix-bins-glibc
          path: bins/
          if-no-files-found: error
          retention-days: 3

  binaries-musl:
    name: Build musl test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Alpine's own toolchain: the glibc release binaries cannot run on musl.
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest sh -euc '
            apk add -q cargo build-base pkgconf fontconfig-dev libxkbcommon-dev \
              mesa-dev wayland-dev dbus-dev
            cargo build --release --locked
            mkdir -p bins
            cp target/release/wireguard-gui target/release/wg-helper bins/'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-matrix-bins-musl
          path: bins/
          if-no-files-found: error
          retention-days: 3

  install:
    name: Install / upgrade / uninstall (${{ matrix.image }})
    needs: [binaries-glibc, binaries-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:stable", libc: glibc }
          - { image: "ubuntu:24.04", libc: glibc }
          - { image: "fedora:latest", libc: glibc }
          - { image: "archlinux:latest", libc: glibc }
          - { image: "alpine:latest", libc: musl }
          - { image: "ghcr.io/void-linux/void-glibc:latest", libc: glibc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous release's install.sh (from its tag) is upgraded too.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-matrix-bins-${{ matrix.libc }}
          path: bins
      - name: Run the integration test
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          chmod 755 bins/*
          bash tests/install-integration.sh "$IMAGE" bins

  packaging:
    name: Packaging recipes (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, fedora, alpine, void]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recipes match Cargo.toml
        run: bash packaging/update-checksums.sh --check
      - name: Lint with the distribution's tools
        env:
          DISTRO: ${{ matrix.distro }}
        run: bash tests/install-packaging-lint.sh "$DISTRO"
