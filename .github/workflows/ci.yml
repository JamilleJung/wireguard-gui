name: CI

# Every job name below is a required status check on `main` (see
# docs/REPO_SETTINGS.md); renaming a job means updating the ruleset too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# CI never needs to write; keep the token read-only regardless of repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fallback when Cargo.toml has no `rust-version`; the lowest toolchain the
  # current lockfile builds with (slint 1.18 needs 1.92).
  MSRV_FALLBACK: "1.92"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Fixtures match scripts/gen-fixtures.sh (fake, deterministic)
        run: bash scripts/gen-fixtures.sh --check
      - name: cargo test (unit, property and fixture tests)
        run: cargo test --locked
      - name: Property tests with more cases
        env:
          PROP_CASES: "20000"
        run: cargo test --locked --release --test 'prop_*'

  build:
    name: Release build, CLI & GUI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Build (release)
        run: cargo build --release --locked
      - name: Smoke test (binary starts & parses args)
        run: |
          ./target/release/wireguard-gui --version | grep -q '^wireguard-gui '
          ./target/release/wireguard-gui --help >/dev/null
      - name: Helper argument validation
        run: bash tests/helper-validation.sh target/release/wg-helper
      - name: CLI contract (release regression)
        run: bash tests/release-regression.sh target/release/wireguard-gui target/release/wg-helper
      # Launch the real GUI headless so a crash during window/tray/a11y init is
      # caught here instead of by users. (Regression guard: the zbus "no reactor
      # running, must be a Tokio runtime" panic shipped undetected because the
      # checks above never opened a window.)
      - name: GUI launch smoke (headless)
        run: |
          # libxkbcommon-x11-0 is needed for the X11 (Xvfb) path; mesa DRI gives
          # a software GL context. The a11y/zbus thread (the regression target)
          # runs once X11+xkb are up, even if the GL render later struggles.
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus libxkbcommon-x11-0 libgl1-mesa-dri libegl-mesa0
          set +e
          xvfb-run -a dbus-run-session -- env LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 8 ./target/release/wireguard-gui >/tmp/gui-launch.log 2>&1
          rc=$?
          set -e
          # Hard-fail on the regression this guard exists for: the zbus/Tokio
          # runtime panic from ksni pulling zbus/tokio vs Slint's async-io a11y.
          if grep -qiE "no reactor running|Tokio 1\.x runtime" /tmp/gui-launch.log; then
            echo "::error::zbus/Tokio-runtime panic on launch (ksni async-io fix regressed)"
            cat /tmp/gui-launch.log; exit 1
          fi
          if [ "$rc" -eq 124 ]; then
            echo "GUI launched and stayed alive 8s under Xvfb — OK"
          else
            echo "::error::wireguard-gui crashed on launch (rc=$rc)"
            cat /tmp/gui-launch.log; exit 1
          fi

  shell:
    name: Shell lint & installer sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shell syntax and lint (installer, tests, scripts)
        run: |
          shopt -s nullglob
          scripts=(install.sh tests/*.sh scripts/*.sh packaging/*.sh packaging/debian/postinst)
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck -S warning "${scripts[@]}"
      - name: Installer sanity
        run: bash tests/installer-sanity.sh

  namespace:
    name: Firewall namespace test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Install firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iptables
      - name: Firewall integration in isolated network namespace
        run: bash tests/firewall-namespace.sh

  e2e:
    name: Kill switch e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Build the helper
        run: cargo build --release --locked --bin wg-helper
      - name: Install WireGuard and firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wireguard-tools nftables iptables iproute2 iputils-ping
          sudo modprobe wireguard
      - name: WireGuard + kill switch + live config update (network namespaces)
        run: |
          test -f tests/killswitch-e2e.sh \
            || { echo "::error::tests/killswitch-e2e.sh is missing"; exit 1; }
          sudo bash tests/killswitch-e2e.sh target/release/wg-helper

  audit:
    name: cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies against the RUSTSEC advisory DB
        # The same narrow, documented exceptions apply to tag releases.
        # See .cargo/audit.toml; real vulnerabilities and new notices fail.
        run: cargo audit --deny warnings

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cargo.toml, Cargo.lock, CHANGELOG and packaging agree
        run: bash scripts/check-version.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine the minimum supported Rust version
        id: msrv
        run: |
          v="$(awk '/^\[/{p=($0=="[package]");next} p&&$1=="rust-version"{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
          echo "version=${v:-$MSRV_FALLBACK}" >> "$GITHUB_OUTPUT"
          echo "MSRV: ${v:-$MSRV_FALLBACK} (${v:+Cargo.toml rust-version}${v:-workflow fallback})" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Build and test with the MSRV toolchain
        run: |
          cargo check --locked --all-targets
          cargo test --locked

  fuzz-check:
    name: Fuzz crate check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # The targets pull src/ modules in by path; this keeps them compiling on
      # every change. Running them needs nightly (see .github/workflows/fuzz.yml).
      - name: Check fuzz targets (stable)
        working-directory: fuzz
        run: cargo clippy --locked --bins -- -D warnings

  coverage:
    # Informational: not a required check.
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov
      - name: Measure test coverage
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 30
