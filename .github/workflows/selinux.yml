name: SELinux VM

# Installs with install.sh in a Fedora Cloud VM with SELinux enforcing and
# checks the helper's bin_t label, the semanage fcontext rule, AVC denials,
# restorecon, the sudo and polkit grants, re-runs, uninstall and the rollback
# after an exec denial (tests/selinux-vm.sh). The VM runs under KVM.
on:
  pull_request:
    paths:
      - install.sh
      - packaging/**
      - src/bin/**
      - tests/selinux-vm.sh
      - .github/workflows/selinux.yml
  push:
    branches: [main]
    # Path filters do not apply to tag pushes: every v* tag runs this.
    tags: ['v*']
    paths:
      - install.sh
      - packaging/**
      - src/bin/**
      - tests/selinux-vm.sh
      - .github/workflows/selinux.yml
  workflow_dispatch:

# Read-only token: nothing here publishes or writes to the repository.
permissions:
  contents: read

concurrency:
  group: selinux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  selinux:
    name: SELinux enforcing (Fedora Cloud VM)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: selinux-vm
      - name: Build
        run: |
          cargo build --release --locked
          mkdir -p bins
          cp target/release/wireguard-gui target/release/wg-helper bins/
      # The udev rule GitHub documents for hardware-accelerated Android
      # emulators: lets the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - name: Run the SELinux VM test
        env:
          SELINUX_VM_DIR: ${{ runner.temp }}/selinux-vm
        run: bash tests/selinux-vm.sh --binaries=bins --arch=x86_64
      - name: Upload the serial console log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selinux-vm-serial-log
          path: ${{ runner.temp }}/selinux-vm/run-*/serial.log
          if-no-files-found: ignore
          retention-days: 7
