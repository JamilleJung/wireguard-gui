name: Fuzz

# Time-boxed libFuzzer runs of the targets in fuzz/ (config parsing and
# validation, redaction, tunnel names, import preflight). Nightly is required
# by cargo-fuzz for sanitizer instrumentation.
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [config_validate, redact, tunnel_names, import_preflight]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version =0.13.2 --locked
      - name: Seed corpus from the test fixtures
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          find tests/fixtures/configs -type f -name '*.conf' -exec cp {} "fuzz/corpus/$TARGET/" \;
      - name: Lockfile is current
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Run (time-boxed)
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -max_len=65536 -timeout=10 -rss_limit_mb=2048
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
