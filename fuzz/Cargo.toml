# Standalone cargo-fuzz crate. It has its own workspace and lockfile so the
# fuzzing dependencies never enter the shipped binaries' dependency graph.
#
#   cargo +nightly fuzz list
#   cargo +nightly fuzz run config_validate -- -max_total_time=60
#
# See CONTRIBUTING.md ("Fuzzing") for details.
[package]
name = "wireguard-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[features]
# Also fuzz rqrr grid detection (known upstream assertion; see qr_select.rs).
detect = []

[dependencies]
libfuzzer-sys = "0.4"
# The ZIP/QR import parsers (src/import_parse.rs) need the same crates and
# features as the app; fuzz/Cargo.lock pins the versions in ../Cargo.lock.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[[bin]]
name = "config_validate"
path = "fuzz_targets/config_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redact"
path = "fuzz_targets/redact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tunnel_names"
path = "fuzz_targets/tunnel_names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_preflight"
path = "fuzz_targets/import_preflight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_zip"
path = "fuzz_targets/backup_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qr_select"
path = "fuzz_targets/qr_select.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
